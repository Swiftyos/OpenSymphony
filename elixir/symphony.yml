# Example multi-project Symphony config. Replace these placeholder values with
# your own Linear project slugs, repo sources, workflow paths, and workspace roots.
tracker:
  kind: linear
  endpoint: https://api.linear.app/graphql
  api_key: $LINEAR_API_KEY
  # Linear's default states. Sub-stages live in the `factory` label group:
  # factory/implement, factory/rework, factory/merge, factory/blocked.
  active_states:
    - Todo
    - In Progress
  stage_label_prefix: factory
  # Only dispatch issues carrying this label, so agents work only on what people
  # opt in. Removing the label stops the agent. Leave unset to dispatch everything.
  # require_label: auto-build
  # Stages that pause dispatch even while the issue is in an active state.
  paused_stages:
    - blocked
    - review
  terminal_states:
    - Closed
    - Cancelled
    - Canceled
    - Duplicate
    - Done

polling:
  interval_ms: 5000

workspace:
  root: ~/work/symphony-workspaces

instance:
  name: local-dev

server:
  port: 4000
  # host: 0.0.0.0        # any non-loopback host turns on username/password sign-in
  # auth: accounts       # or force: local | accounts
  # api_token: $SYMPHONY_API_TOKEN   # bearer token for /api/v1/* and /metrics scrapers
  # trust_proxy: true    # behind a TLS proxy: use X-Forwarded-For / X-Forwarded-Proto
  # controls: false      # read-only dashboard for everyone
  # mcp:                 # MCP endpoint for agents at /mcp (tokens from /account)
  #   enabled: true
  #   host: mcp.symphony.example.com   # serves only /mcp: route it around IAP

agent:
  backend: codex
  default_effort: medium
  max_concurrent_agents: 10
  max_turns: 20
  # Kubernetes runner pods (Phase 3). Only needed when the Kubernetes launcher is
  # selected; see docs/durable-runs.md.
  # kubernetes:
  #   namespace: symphony-runs
  #   runner_image: europe-north1-docker.pkg.dev/PROJECT/symphony/symphony:REVISION
  #   agent_tools_image: europe-north1-docker.pkg.dev/PROJECT/symphony/symphony-agent-tools:REVISION
  #   cpu_request: 500m
  #   cpu_limit: "2"
  #   memory_request: 1Gi
  #   memory_limit: 4Gi
  #   active_deadline_seconds: 21600
  #   run_as_user: 10001
  #   queue_name: symphony
  #   workspace_size_limit: 20Gi
  #   agent_tools_size_limit: 1Gi
  #   ephemeral_storage_request: 2Gi
  #   ephemeral_storage_limit: 24Gi
  #   secret_env:
  #     - {env: ANTHROPIC_API_KEY, secret: symphony-anthropic, key: api-key}
  #     - {env: GITHUB_TOKEN, secret: symphony-github, key: token}

codex:
  command: codex --config shell_environment_policy.inherit=all --config model_reasoning_effort=medium --model gpt-5.4 app-server
  approval_policy: never
  thread_sandbox: danger-full-access
  turn_sandbox_policy:
    type: dangerFullAccess

claude:
  command: claude
  permission_mode: bypassPermissions
  turn_sandbox_policy:
    type: dangerFullAccess

opencode:
  command: opencode serve --hostname 127.0.0.1 --port 0
  agent: build

# Optional per-issue container isolation. Each workspace gets one long-lived
# container (bind-mounted at the same path); hooks and the agent CLI run inside
# it via `docker exec`. The image must provide bash, git, gh, and the agent CLIs
# you route to (codex and/or claude; node for Claude's Linear MCP shim).
# OpenCode and SSH worker hosts are not supported with the sandbox yet.
sandbox:
  kind: none # docker
  image: symphony-agent:latest
  # network: bridge
  env:
    - GH_TOKEN
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
  mounts:
    - ~/.gitconfig:/root/.gitconfig:ro
  # run_args: ["--cpus", "4", "--memory", "8g"]

telemetry:
  enabled: false
  # otlp_endpoint: http://localhost:11338
  # otlp_protocol: grpc
  # include_traces: true
  # include_metrics: true
  # include_logs: true
  # resource_attributes:
  #   environment: local-dev

# Optional: read telemetry back into the dashboard (metrics from ClickHouse,
# traces from Langfuse and ClickHouse). Values may be $ENV_VAR references.
# observability:
#   clickhouse:
#     url: http://127.0.0.1:8123
#     user: symphony
#     password: $SYMPHONY_CLICKHOUSE_PASSWORD
#     database: otel
#   langfuse:
#     url: http://127.0.0.1:3000
#     public_key: $LANGFUSE_PUBLIC_KEY
#     secret_key: $LANGFUSE_SECRET_KEY

projects:
  - linear_project: project-a
    repo: your-org/project-a
    workspace_root: ~/work/symphony-workspaces/project-a
    backend: codex
    # Workspace hooks for this project (over a top-level `hooks:` block).
    hooks:
      after_create: |
        if [ -f mise.toml ]; then mise trust && mise exec -- mix deps.get; fi
    # Optional: replace Symphony's built-in agent prompt with your own template.
    # prompt: prompts/project-a.md
    # Other repos this project's issues may need work in. An issue is worked in the
    # repo its `repo/<name>` label names, else `repo`; see README "Multi-repo projects".
    # repos:
    #   - name: worker
    #     repo: your-org/project-a-worker
    #     default_branch: main
    #     description: Queue consumers and scheduled jobs

  - linear_project: project-b
    repo: your-org/project-b
    # Optional: take the prompt and agent settings from a WORKFLOW.md in the repo instead.
    # workflow: WORKFLOW.md
    default_branch: main
    workspace_root: ~/work/symphony-workspaces/project-b
    backend: claude
