# Example multi-project Symphony config. Replace these placeholder values with
# your own Linear project slugs, repo sources, workflow paths, and workspace roots.
tracker:
  kind: linear
  endpoint: https://api.linear.app/graphql
  api_key: $LINEAR_API_KEY
  # Linear's default states. Sub-stages live in the `factory` label group:
  # factory/implement, factory/rework, factory/merge, factory/blocked.
  active_states:
    - Todo
    - In Progress
  stage_label_prefix: factory
  # Only dispatch issues carrying this label, so agents work only on what people
  # opt in. Removing the label stops the agent. Leave unset to dispatch everything.
  # require_label: auto-build
  # Stages that pause dispatch even while the issue is in an active state.
  paused_stages:
    - blocked
    - review
  terminal_states:
    - Closed
    - Cancelled
    - Canceled
    - Duplicate
    - Done

polling:
  interval_ms: 5000

workspace:
  root: ~/work/symphony-workspaces

instance:
  name: local-dev

server:
  port: 4000
  # host: 0.0.0.0        # any non-loopback host turns on username/password sign-in
  # auth: accounts       # or force: local | accounts
  # api_token: $SYMPHONY_API_TOKEN   # bearer token for /api/v1/* and /metrics scrapers
  # trust_proxy: true    # behind a TLS proxy: use X-Forwarded-For / X-Forwarded-Proto
  # controls: false      # read-only dashboard for everyone

agent:
  backend: codex
  default_effort: medium
  max_concurrent_agents: 10
  max_turns: 20

codex:
  command: codex --config shell_environment_policy.inherit=all --config model_reasoning_effort=medium --model gpt-5.4 app-server
  approval_policy: never
  thread_sandbox: danger-full-access
  turn_sandbox_policy:
    type: dangerFullAccess

claude:
  command: claude
  permission_mode: bypassPermissions
  turn_sandbox_policy:
    type: dangerFullAccess

opencode:
  command: opencode serve --hostname 127.0.0.1 --port 0
  agent: build

# Optional per-issue container isolation. Each workspace gets one long-lived
# container (bind-mounted at the same path); hooks and the agent CLI run inside
# it via `docker exec`. The image must provide bash, git, gh, and the agent CLIs
# you route to (codex and/or claude; node for Claude's Linear MCP shim).
# OpenCode and SSH worker hosts are not supported with the sandbox yet.
sandbox:
  kind: none # docker
  image: symphony-agent:latest
  # network: bridge
  env:
    - GH_TOKEN
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
  mounts:
    - ~/.gitconfig:/root/.gitconfig:ro
  # run_args: ["--cpus", "4", "--memory", "8g"]

telemetry:
  enabled: false
  # otlp_endpoint: http://localhost:11338
  # otlp_protocol: grpc
  # include_traces: true
  # include_metrics: true
  # include_logs: true
  # resource_attributes:
  #   environment: local-dev

projects:
  - linear_project: project-a
    repo: your-org/project-a
    workflow: WORKFLOW.md
    workspace_root: ~/work/symphony-workspaces/project-a
    backend: codex

  - linear_project: project-b
    repo: your-org/project-b
    workflow: WORKFLOW.md
    default_branch: main
    workspace_root: ~/work/symphony-workspaces/project-b
    backend: claude
